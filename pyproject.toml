[project]
name = "secure-sql-agent"
version = "0.3.0"
description = "Secure, self-validating natural-language-to-SQL agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "sqlglot==25.24.0",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# `uv sync` installs this group by default, so `uv run pytest` just works.
[dependency-groups]
dev = ["pytest>=8.0"]

# This is an application, not a library: uv only builds the virtualenv.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
