[project]
name = "secure-sql-agent"
version = "0.2.0"
description = "Secure, self-validating natural-language-to-SQL agent"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1",
    "sqlglot==25.24.0",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
]
 
[project.optional-dependencies]
dev = ["pytest>=8.0"]
 
[project.scripts]
sql-agent = "app.main:main"
 
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
