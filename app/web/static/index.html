<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Agent</title>
<style>
:root {
  --paper: #eef1f4;
  --sheet: #ffffff;
  --ink: #17253a;
  --ink-2: #4b5b70;
  --ink-3: #7d8a9b;
  --rule: #d6dde5;
  --rule-2: #e7ecf1;
  --blue: #2b5fae;
  --blue-wash: #e8f0fb;
  --grid: #dde6f1;
  --read: #1d7a66;
  --read-wash: #e4f3ef;
  --write: #a8630f;
  --write-wash: #fbf1e2;
  --stop: #b3261e;
  --stop-wash: #fbeceb;
  --sans: "IBM Plex Sans", "Segoe UI", Ubuntu, Cantarell, "Noto Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", "Cascadia Mono", "Ubuntu Mono", ui-monospace, monospace;
  --r-sm: 4px;
  --r-md: 8px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.5;
  color: var(--ink); background: var(--paper);
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); }

/* ---------------------------------------------------------------- layout */
.app { display: grid; grid-template-columns: 290px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 20px;
  padding: 10px 20px; background: var(--ink); color: #fff;
}
.brand { font-weight: 600; font-size: 16px; letter-spacing: .01em; display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.conn { display: flex; align-items: center; gap: 8px; color: #c9d3df; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #8a96a6; }
.dot.ok { background: #4cc39f; }
.dot.bad { background: #ff7a70; }
.header-spacer { flex: 1; }
.model { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #c9d3df; }
.model select {
  background: #24354d; color: #fff; border: 1px solid #3a4d68; border-radius: var(--r-sm);
  padding: 4px 8px; max-width: 220px;
}

aside {
  background: var(--sheet); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; min-height: 0;
}
.aside-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule-2); }
.aside-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.aside-title h2 { font-size: 14px; margin: 0; }
.link-btn { background: none; border: 0; color: var(--blue); cursor: pointer; padding: 0; font-size: 13px; }
.link-btn:hover { text-decoration: underline; }
.search {
  width: 100%; padding: 6px 10px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--paper);
}
.tables { overflow: auto; flex: 1; padding: 6px 0 16px; }
.t-item { border-bottom: 1px solid var(--rule-2); }
.t-row {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 16px;
  background: none; border: 0; cursor: pointer; text-align: left;
}
.t-row:hover { background: var(--blue-wash); }
.t-row .chev { color: var(--ink-3); transition: transform .15s; width: 10px; }
.t-item.open .chev { transform: rotate(90deg); }
.t-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; }
.t-count { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.t-cols { display: none; padding: 2px 16px 10px 34px; }
.t-item.open .t-cols { display: block; }
.col { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; font-size: 12.5px; padding: 2px 0; align-items: baseline; }
.col .ty { color: var(--ink-3); font-family: var(--mono); font-size: 11px; }
.col .fk { grid-column: 2 / -1; color: var(--blue); font-size: 11.5px; margin-top: -2px; }
.t-actions { display: flex; gap: 12px; padding-top: 6px; }

main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 10px 20px 0; border-bottom: 1px solid var(--rule); background: var(--paper); }
.tab {
  padding: 8px 16px; border: 1px solid transparent; border-bottom: 0; background: none; cursor: pointer;
  border-radius: var(--r-md) var(--r-md) 0 0; color: var(--ink-2); margin-bottom: -1px;
}
.tab[aria-selected="true"] { background: var(--sheet); border-color: var(--rule); color: var(--ink); font-weight: 600; }
.view { flex: 1; min-height: 0; display: none; }
.view.active { display: flex; flex-direction: column; }

/* ------------------------------------------------------------------ ask */
.thread { flex: 1; overflow: auto; padding: 24px 28px 8px; background: var(--sheet); }
.thread-inner { max-width: 1080px; margin: 0 auto; }
.empty { max-width: 640px; margin: 40px auto; color: var(--ink-2); }
.empty h3 { color: var(--ink); font-size: 20px; margin: 0 0 6px; font-weight: 600; }
.empty p { margin: 0 0 18px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 6px 12px;
  cursor: pointer; font-size: 13px;
}
.chip:hover { border-color: var(--blue); color: var(--blue); }
.chip.write { border-style: dashed; }

.ex { margin-bottom: 28px; }
.q { font-weight: 600; font-size: 15px; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.q .who { color: var(--ink-3); font-weight: 400; font-size: 13px; flex: none; }
.answer { border: 1px solid var(--rule); border-left: 4px solid var(--ink-3); border-radius: var(--r-md); background: var(--sheet); }
.answer.read { border-left-color: var(--read); }
.answer.write { border-left-color: var(--write); }
.answer.stop { border-left-color: var(--stop); }
.answer.wait { border-left-color: var(--blue); }
.a-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule-2); flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-sm); }
.badge.read { color: var(--read); background: var(--read-wash); }
.badge.write { color: var(--write); background: var(--write-wash); }
.badge.stop { color: var(--stop); background: var(--stop-wash); }
.badge.neutral { color: var(--ink-2); background: var(--rule-2); }
.badge.wait { color: var(--blue); background: var(--blue-wash); }
.msg { color: var(--ink-2); flex: 1; min-width: 200px; }
.timer { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; }

.sqlbox { position: relative; margin: 0; padding: 12px 14px; background: #f7f9fb; border-bottom: 1px solid var(--rule-2); }
.sqlbox pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.55; }
.sqlbox .copy { position: absolute; top: 8px; right: 10px; }
.kw { color: var(--blue); font-weight: 600; }
.st { color: #9a3b26; }
.nu { color: #7a4fb0; }
.pa { color: var(--write); font-weight: 600; }
.cm { color: var(--ink-3); font-style: italic; }

.meta { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 14px; border-bottom: 1px solid var(--rule-2); align-items: center; }
.params { display: flex; gap: 6px; flex-wrap: wrap; }
.param { font-family: var(--mono); font-size: 12px; background: var(--write-wash); border-radius: var(--r-sm); padding: 2px 6px; }
.explain { color: var(--ink-2); font-size: 13px; }

.steps { display: flex; align-items: center; gap: 0; font-size: 12px; }
.step { display: flex; align-items: center; gap: 5px; color: var(--ink-3); }
.step + .step::before { content: ""; width: 18px; height: 1px; background: var(--rule); margin: 0 6px; }
.step .mk {
  width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 10px; border: 1px solid var(--rule); color: var(--ink-3); background: #fff;
}
.step.pass { color: var(--read); }
.step.pass .mk { background: var(--read); border-color: var(--read); color: #fff; }
.step.fail { color: var(--stop); font-weight: 600; }
.step.fail .mk { background: var(--stop); border-color: var(--stop); color: #fff; }

.issues { margin: 0; padding: 10px 14px 10px 32px; color: var(--stop); border-bottom: 1px solid var(--rule-2); font-size: 13px; }

.result { padding: 0; }
.result-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; font-size: 13px; color: var(--ink-2); }
.grid-wrap { max-height: 420px; overflow: auto; border-top: 1px solid var(--rule-2); }
table.grid { border-collapse: collapse; width: auto; min-width: 50%; font-size: 13px; }
.grid th, .grid td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--rule-2); white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
.grid th { position: sticky; top: 0; background: #f3f6f9; font-weight: 600; cursor: pointer; user-select: none; }
.grid th:hover { color: var(--blue); }
.grid th.num { text-align: right; }
.grid td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12.5px; }
.grid td.null { color: var(--ink-3); font-style: italic; }
.grid tr:hover td { background: #f8fafc; }

.approve { padding: 14px; background: var(--write-wash); border-radius: 0 0 var(--r-md) var(--r-md); }
.approve p { margin: 0 0 10px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--rule); background: #fff; border-radius: var(--r-sm); padding: 6px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #24384f; }
.btn.go-write { background: var(--write); color: #fff; border-color: var(--write); }
.btn.go-write:hover { background: #8e520b; }
.btn.small { padding: 3px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.edit-area { margin-top: 10px; display: grid; gap: 8px; }
textarea.code {
  width: 100%; font-family: var(--mono); font-size: 13px; padding: 10px; border: 1px solid var(--rule);
  border-radius: var(--r-sm); background: #fff; resize: vertical; line-height: 1.5;
}
label.lbl { font-size: 12.5px; color: var(--ink-2); display: block; margin-bottom: 3px; }

.composer { border-top: 1px solid var(--rule); background: var(--paper); padding: 14px 28px 16px; }
.composer-inner { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.composer textarea {
  width: 100%; resize: none; min-height: 46px; max-height: 160px; padding: 12px 14px; border: 1px solid var(--rule);
  border-radius: var(--r-md); background: #fff; font-size: 15px;
}
.composer-opts { grid-column: 1 / -1; display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); align-items: center; }
.composer-opts kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; background: #fff; }
.ask-btn { height: 46px; padding: 0 22px; }

/* ---------------------------------------------------------- schema map */
.map-tools { display: flex; gap: 8px; align-items: center; padding: 10px 20px; background: var(--sheet); border-bottom: 1px solid var(--rule-2); flex-wrap: wrap; }
.legend { display: flex; gap: 16px; color: var(--ink-2); font-size: 12.5px; margin-left: auto; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.map-wrap { flex: 1; min-height: 0; position: relative; background-color: #f6f9fc;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(#e9eff6 1px, transparent 1px),
    linear-gradient(90deg, #e9eff6 1px, transparent 1px);
  background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
}
#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.panning { cursor: grabbing; }
.tbl rect.body { fill: #fff; stroke: #9fb3cc; stroke-width: 1; }
.tbl rect.head { fill: var(--ink); }
.tbl.view-kind rect.head { fill: #4b5b70; }
.tbl text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
.tbl text.title { fill: #fff; font-weight: 600; font-size: 13px; }
.tbl text.count { fill: #b9c6d6; font-size: 11px; }
.tbl text.type { fill: var(--ink-3); font-family: var(--mono); font-size: 10.5px; }
.tbl text.key { fill: var(--write); font-weight: 700; font-size: 10px; }
.tbl text.fkmark { fill: var(--blue); font-weight: 700; font-size: 10px; }
.tbl { cursor: pointer; }
.tbl:hover rect.body { stroke: var(--blue); }
.tbl.sel rect.body { stroke: var(--blue); stroke-width: 2; }
.tbl.dim { opacity: .28; }
.edge { fill: none; stroke: #7f9cc4; stroke-width: 1.4; }
.edge.hot { stroke: var(--blue); stroke-width: 2.2; }
.edge.dim { opacity: .15; }
.edge-dot { fill: #7f9cc4; }
.edge-dot.hot { fill: var(--blue); }
.edge-dot.dim { opacity: .15; }
.preview { max-height: 42%; min-height: 0; display: none; flex-direction: column; border-top: 1px solid var(--rule); background: var(--sheet); }
.preview.show { display: flex; }
.preview-head { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--rule-2); }
.preview-head h3 { margin: 0; font-size: 14px; }
.preview .grid-wrap { max-height: none; flex: 1; border-top: 0; }

/* -------------------------------------------------------------- write sql */
.editor { flex: 1; overflow: auto; padding: 20px 28px; background: var(--sheet); }
.editor-inner { max-width: 1080px; margin: 0 auto; display: grid; gap: 12px; }
.editor-inner p { margin: 0; color: var(--ink-2); }
#sqlOut:empty { display: none; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: var(--r-sm); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
.muted { color: var(--ink-3); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; min-height: 100vh; }
  aside { max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  .model select { max-width: 140px; }
  .thread, .composer, .editor { padding-left: 14px; padding-right: 14px; }
  .legend { margin-left: 0; }
  .view.active { min-height: 70vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <ellipse cx="11" cy="5" rx="8" ry="3" fill="none" stroke="#fff" stroke-width="1.6"/>
        <path d="M3 5v12c0 1.7 3.6 3 8 3s8-1.3 8-3V5" fill="none" stroke="#fff" stroke-width="1.6"/>
        <path d="M7.5 12.5l2.4 2.4 4.6-4.8" fill="none" stroke="#4cc39f" stroke-width="2"/>
      </svg>
      SQL Agent
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></div>
    <div class="header-spacer"></div>
    <div class="model" id="modelBox"></div>
  </header>

  <aside>
    <div class="aside-head">
      <div class="aside-title">
        <h2>Tables</h2>
        <button class="link-btn" id="refreshBtn" title="Reload tables and columns from the database">Reload</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Find a table or column" aria-label="Find a table or column">
    </div>
    <div class="tables" id="tables"><p class="muted" style="padding:0 16px">Loading…</p></div>
  </aside>

  <main>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="ask">Ask</button>
      <button class="tab" role="tab" aria-selected="false" data-view="map">Schema map</button>
      <button class="tab" role="tab" aria-selected="false" data-view="sql">Write SQL</button>
    </div>

    <section class="view active" id="view-ask" role="tabpanel">
      <div class="thread" id="thread"><div class="thread-inner" id="threadInner"></div></div>
      <form class="composer" id="composer">
        <div class="composer-inner">
          <textarea id="question" rows="1" placeholder="Ask about your data, e.g. top 3 customers by total spent" aria-label="Question"></textarea>
          <button class="btn primary ask-btn" id="askBtn" type="submit">Ask</button>
          <div class="composer-opts">
            <label><input type="checkbox" id="onlySql"> Only show the SQL, don't run it</label>
            <span class="muted"><kbd>Enter</kbd> to ask, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          </div>
        </div>
      </form>
    </section>

    <section class="view" id="view-map" role="tabpanel">
      <div class="map-tools">
        <button class="btn small" id="fitBtn">Fit to screen</button>
        <button class="btn small" id="zoomIn" aria-label="Zoom in">+</button>
        <button class="btn small" id="zoomOut" aria-label="Zoom out">−</button>
        <span class="muted" style="font-size:12.5px">Drag to move, scroll to zoom, click a table to see its rows</span>
        <div class="legend">
          <span><svg width="14" height="12"><text x="1" y="10" font-size="10" font-weight="700" fill="#a8630f">PK</text></svg> primary key</span>
          <span><svg width="14" height="12"><text x="1" y="10" font-size="10" font-weight="700" fill="#2b5fae">FK</text></svg> foreign key</span>
          <span><svg width="30" height="10"><path d="M2 5 H28" stroke="#7f9cc4" stroke-width="1.6"/><circle cx="27" cy="5" r="3" fill="#7f9cc4"/></svg> references</span>
        </div>
      </div>
      <div class="map-wrap"><svg id="map" aria-label="Schema diagram"></svg></div>
      <div class="preview" id="preview">
        <div class="preview-head">
          <h3 id="previewTitle"></h3>
          <span class="muted" id="previewInfo"></span>
          <div class="header-spacer"></div>
          <button class="btn small" id="previewAsk">Ask about this table</button>
          <button class="btn small" id="previewClose">Close</button>
        </div>
        <div class="grid-wrap" id="previewGrid"></div>
      </div>
    </section>

    <section class="view" id="view-sql" role="tabpanel">
      <div class="editor">
        <div class="editor-inner">
          <p>Write your own SQL. It goes through the same checks as generated SQL; changes to data still need your approval.</p>
          <div>
            <label class="lbl" for="sqlText">SQL</label>
            <textarea class="code" id="sqlText" rows="8" spellcheck="false" placeholder="SELECT c.full_name, c.email FROM customers c WHERE c.is_active = :p_active LIMIT 20"></textarea>
          </div>
          <div>
            <label class="lbl" for="sqlParams">Parameters (JSON)</label>
            <textarea class="code" id="sqlParams" rows="2" spellcheck="false" placeholder='{"p_active": true}'></textarea>
          </div>
          <div class="btns">
            <button class="btn" id="checkSql">Check</button>
            <button class="btn primary" id="runSql">Run</button>
          </div>
          <div id="sqlOut"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const state = { schema: [], status: null, selected: null, view: { x: 0, y: 0, w: 1000, h: 700 }, layout: null };

/* ------------------------------------------------------------- helpers */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  let res;
  try { res = await fetch(path, opts); }
  catch { throw new Error("Can't reach the agent server. Check that 'uv run python -m app.web' is still running."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : `Request failed (${res.status})`);
  }
  return data;
}

const KEYWORDS = new Set(("select from where and or not in is null as on join left right inner outer full cross group by order having limit offset " +
  "insert into values update set delete returning with distinct case when then else end union all intersect except exists between like ilike " +
  "asc desc nulls first last cast interval true false count sum avg min max coalesce over partition create alter drop table index explain " +
  "date_trunc now current_date current_timestamp extract filter lateral using conflict do nothing").split(" "));
function highlight(sql) {
  const re = /(--[^\n]*)|('(?:[^']|'')*')|(:[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|([\s\S])/g;
  let out = "", m;
  while ((m = re.exec(sql))) {
    if (m[1]) out += `<span class="cm">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="st">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="pa">${esc(m[3])}</span>`;
    else if (m[4]) out += `<span class="nu">${esc(m[4])}</span>`;
    else if (m[5]) out += KEYWORDS.has(m[5].toLowerCase()) ? `<span class="kw">${esc(m[5])}</span>` : esc(m[5]);

function prettySql(sql) {

  // so EXTRACT(YEAR FROM ...) and sub-queries stay intact.

    const ch = sql[i];

    if (ch === "'") { quote = true; out += ch; continue; }
    if (ch === "(") depth++;

    if (depth === 0 && /\s/.test(ch)) {

      const m = kw.exec(sql);

/* ---------------------------------------------------------- data table */

  if (!rows.length) return h("p", { class: "muted", style: "padding:10px 14px;margin:0" }, "No rows.");
  let sortCol = null, asc = true;
  const table = h("table", { class: "grid" });
  const numeric = new Set(cols.filter(c => rows.some(r => r[c] != null) && rows.every(r => r[c] == null || isNum(r[c]))));
  const thead = h("thead", {}, h("tr", {}, cols.map(c => h("th", { class: numeric.has(c) ? "num" : null, title: "Sort", onclick: () => sortBy(c) }, c))));

      const v = r[c];

const STAGES = [["parser", "Parsed"], ["policy", "Allowed"], ["parameters", "Values"], ["schema", "Schema"], ["live", "Database check"]];

function kindOf(r) {

/* ----------------------------------------------------------- schema map */
const BOX_W = 232, HEAD_H = 30, ROW_H = 21, COL_GAP = 120, ROW_GAP = 36, PAD = 40;
function computeLayout(tables) {
  const byKey = new Map(tables.map(t => [tkey(t), t]));
  const refs = t => [...new Set(t.columns.filter(c => c.fk).map(c => `${c.fk.schema}.${c.fk.table}`))].filter(k => k !== tkey(t) && byKey.has(k));
  const level = new Map();
  const depth = (t, seen = new Set()) => {
    const k = tkey(t);
    if (level.has(k)) return level.get(k);
    if (seen.has(k)) return 0;
    seen.add(k);
    const l = refs(t).reduce((m, r) => Math.max(m, depth(byKey.get(r), seen) + 1), 0);
    level.set(k, l);
    return l;
  };
  tables.forEach(t => depth(t));
  const cols = [];
  tables.forEach(t => { const l = level.get(tkey(t)); (cols[l] = cols[l] || []).push(t); });
  const pos = new Map();
  cols.forEach((list, ci) => {
    if (ci > 0) {
      const centre = t => { const rs = refs(t).filter(r => pos.has(r)); return rs.length ? rs.reduce((s, r) => s + pos.get(r).cy, 0) / rs.length : 1e9; };
      list.sort((a, b) => centre(a) - centre(b) || a.name.localeCompare(b.name));
    } else {
      list.sort((a, b) => b.columns.length - a.columns.length || a.name.localeCompare(b.name));
    }
    let y = PAD;
    list.forEach(t => {
      const hgt = HEAD_H + t.columns.length * ROW_H + 8;
      const x = PAD + ci * (BOX_W + COL_GAP);
      pos.set(tkey(t), { x, y, w: BOX_W, h: hgt, cy: y + hgt / 2 });
      y += hgt + ROW_GAP;
    });
  });
  let W = 0, H = 0;
  pos.forEach(p => { W = Math.max(W, p.x + p.w + PAD); H = Math.max(H, p.y + p.h + PAD); });
  return { pos, W, H };
}

  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  kids.flat().forEach(k => k != null && el.append(k.nodeType ? k : document.createTextNode(String(k))));
  return el;
}
function drawMap() {
  const map = $("#map");

  if (!state.layout) state.layout = computeLayout(state.schema);
  const { pos } = state.layout;
  const edgesG = svg("g"), tablesG = svg("g");
  const byKey = new Map(state.schema.map(t => [tkey(t), t]));
  const rowY = (t, col) => pos.get(tkey(t)).y + HEAD_H + 4 + t.columns.findIndex(c => c.name === col) * ROW_H + ROW_H / 2;

  state.schema.forEach(t => {
    t.columns.filter(c => c.fk).forEach(c => {
      const target = byKey.get(`${c.fk.schema}.${c.fk.table}`);
      if (!target) return;
      const a = pos.get(tkey(t)), b = pos.get(tkey(target));
      const y1 = rowY(t, c.name), y2 = rowY(target, c.fk.column) || b.y + HEAD_H / 2;
      let d, endX;
      if (target === t) {
        const x = a.x + a.w;
        d = `M${x} ${y1} C${x + 46} ${y1}, ${x + 46} ${y2}, ${x} ${y2}`; endX = x;
      } else if (b.x + b.w <= a.x) {

        d = `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`; endX = x2;
      } else {
        const x1 = a.x + a.w, x2 = b.x, mx = (x1 + x2) / 2;
        d = `M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`; endX = x2;
      }

      edgesG.append(svg("path", { class: "edge", d, "data-ends": ends }), svg("circle", { class: "edge-dot", cx: endX, cy: y2, r: 3.2, "data-ends": ends }));
    });

  state.schema.forEach(t => {
    const p = pos.get(tkey(t));
    const g = svg("g", { class: `tbl ${t.kind === "view" ? "view-kind" : ""}`, "data-key": tkey(t), transform: `translate(${p.x},${p.y})`, tabindex: 0, role: "button", "aria-label": `Table ${t.name}` });
    g.append(

      svg("text", { class: "title", x: 12, y: 20 }, t.name.length > 24 ? t.name.slice(0, 23) + "…" : t.name),
      svg("text", { class: "count", x: p.w - 12, y: 20, "text-anchor": "end" }, t.row_count == null ? (t.kind === "view" ? "view" : "") : `${Number(t.row_count).toLocaleString()} rows`));
    t.columns.forEach((c, i) => {
      const y = HEAD_H + 4 + i * ROW_H + 14;
      if (i % 2 === 1) g.append(svg("rect", { x: 1, y: HEAD_H + 4 + i * ROW_H, width: p.w - 2, height: ROW_H, fill: "#f6f8fb" }));
      if (c.pk) g.append(svg("text", { class: "key", x: 10, y }, "PK"));
      else if (c.fk) g.append(svg("text", { class: "fkmark", x: 10, y }, "FK"));
      g.append(svg("text", { x: 32, y, "font-weight": c.pk ? 600 : 400 }, c.name.length > 20 ? c.name.slice(0, 19) + "…" : c.name));
      const ty = c.type.toLowerCase().replace("character varying", "varchar").replace("timestamp without time zone", "timestamp");
      g.append(svg("text", { class: "type", x: p.w - 10, y, "text-anchor": "end" }, ty.length > 16 ? ty.slice(0, 15) + "…" : ty));
    });
    g.addEventListener("click", e => { e.stopPropagation(); selectTable(tkey(t)); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectTable(tkey(t)); } });
    tablesG.append(g);
  });
  map.replaceChildren(edgesG, tablesG);
  applyView();

}

  if (!state.layout || !r.width || !r.height) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  keys.forEach(k => { const p = state.layout.pos.get(k); if (!p) return; x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.h); });
  if (!isFinite(x0)) return;
  const pad = 40, ar = r.width / r.height;
  let w = x1 - x0 + pad * 2, hh = y1 - y0 + pad * 2;
  if (w / hh > ar) hh = w / ar; else w = hh * ar;
  w = Math.max(w, 600); hh = w / ar;
  state.view = { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - hh / 2, w, h: hh };
  applyView();
}
function highlightSel() {
  const k = state.selected;
  const linked = new Set([k]);
  document.querySelectorAll("#map [data-ends]").forEach(e => { const [a, b] = e.dataset.ends.split("|"); if (a === k) linked.add(b); if (b === k) linked.add(a); });
  document.querySelectorAll("#map .tbl").forEach(g => { g.classList.toggle("sel", g.dataset.key === k); g.classList.toggle("dim", !!k && !linked.has(g.dataset.key)); });
  document.querySelectorAll("#map [data-ends]").forEach(e => { const [a, b] = e.dataset.ends.split("|"); const hot = a === k || b === k; e.classList.toggle("hot", !!k && hot); e.classList.toggle("dim", !!k && !hot); });
}
async function selectTable(k) {
  state.selected = k;
  highlightSel();
  const t = state.schema.find(x => tkey(x) === k);
  if (!t) return;
  const pv = $("#preview");
  pv.classList.add("show");
  requestAnimationFrame(() => focusOn(linkedTo(k)));
  $("#previewTitle").textContent = t.name;
  $("#previewInfo").textContent = "Loading rows…";
  $("#previewGrid").replaceChildren();
  try {
    const r = await api(`/api/tables/${encodeURIComponent(t.schema)}/${encodeURIComponent(t.name)}/preview`);
    if (state.selected !== k) return;
    $("#previewInfo").textContent = `First ${r.row_count} rows, ${t.columns.length} columns`;
    $("#previewGrid").replaceChildren(dataGrid(r.columns, r.rows));
  } catch (e) { $("#previewInfo").textContent = e.message; }
}
$("#previewClose").addEventListener("click", () => { $("#preview").classList.remove("show"); state.selected = null; highlightSel(); requestAnimationFrame(fit); });
$("#previewAsk").addEventListener("click", () => {
  const t = state.schema.find(x => tkey(x) === state.selected); if (!t) return;
  showView("ask"); const q = $("#question"); q.value = `Show 10 rows from ${t.name}`; grow(); q.focus();
});
$("#map").addEventListener("click", () => { if (state.selected) { state.selected = null; highlightSel(); $("#preview").classList.remove("show"); requestAnimationFrame(fit); } });

/* pan & zoom via viewBox */
function applyView() { const v = state.view; $("#map").setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`); }
function fit() {
  if (!state.layout) return;
  const r = $("#map").getBoundingClientRect();
  if (!r.width || !r.height) return;
  const { W, H } = state.layout, ar = r.width / r.height;
  let w = W, hh = H;
  if (W / H > ar) hh = W / ar; else w = H * ar;
  state.view = { x: (W - w) / 2, y: (H - hh) / 2, w, h: hh };
  applyView();
}
function zoom(f, cx, cy) {
  const v = state.view;
  if (cx == null) { cx = v.x + v.w / 2; cy = v.y + v.h / 2; }
  const nw = Math.min(Math.max(v.w * f, 200), 8000), k = nw / v.w;
  state.view = { x: cx - (cx - v.x) * k, y: cy - (cy - v.y) * k, w: nw, h: v.h * k };
  applyView();
}
$("#fitBtn").addEventListener("click", fit);
$("#zoomIn").addEventListener("click", () => zoom(0.8));
$("#zoomOut").addEventListener("click", () => zoom(1.25));
(() => {
  const map = $("#map"); let drag = null;
  map.addEventListener("wheel", e => {
    e.preventDefault();
    const r = map.getBoundingClientRect(), v = state.view;
    zoom(e.deltaY > 0 ? 1.12 : 0.89, v.x + (e.clientX - r.left) / r.width * v.w, v.y + (e.clientY - r.top) / r.height * v.h);
  }, { passive: false });
  map.addEventListener("pointerdown", e => { if (e.target.closest(".tbl")) return; drag = { x: e.clientX, y: e.clientY, v: { ...state.view }, moved: false }; map.setPointerCapture(e.pointerId); map.classList.add("panning"); });
  map.addEventListener("pointermove", e => {
    if (!drag) return;
    const r = map.getBoundingClientRect(), dx = (e.clientX - drag.x) / r.width * drag.v.w, dy = (e.clientY - drag.y) / r.height * drag.v.h;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
    state.view = { ...drag.v, x: drag.v.x - dx, y: drag.v.y - dy }; applyView();
  });
  const end = e => { if (drag && drag.moved) e.stopPropagation(); drag = null; map.classList.remove("panning"); };
  map.addEventListener("pointerup", end); map.addEventListener("pointercancel", end);
  window.addEventListener("resize", () => { if ($("#view-map").classList.contains("active")) fit(); });
})();

/* ------------------------------------------------------- header, model */
async function loadStatus() {
  try {
    const s = state.status = await api("/api/status");
    $("#connDot").className = "dot ok";
    $("#connText").textContent = `Connected to ${s.database || "the database"}`;
  } catch (e) {
    $("#connDot").className = "dot bad";
    $("#connText").textContent = "Server not reachable";
  }
}
async function loadModels() {
  const box = $("#modelBox");
  try {
    const m = await api("/api/models");
    if (m.provider === "ollama" && m.available.length) {
      const sel = h("select", { "aria-label": "Model", title: m.error || "Model used to write SQL" }, m.available.map(n => h("option", { value: n, selected: n === m.current }, n)));
      sel.addEventListener("change", async () => {
        try { await api("/api/models", { name: sel.value }); toast(`Now using ${sel.value}`); }
        catch (e) { toast(e.message); }
      });
      box.replaceChildren(h("span", {}, "Model"), sel);
    } else {
      box.replaceChildren(h("span", {}, `${m.provider}${m.current ? ": " + m.current : ""}`));
    }
  } catch { box.replaceChildren(); }
}
async function loadSchema() {
  try { state.schema = (await api("/api/schema")).tables; state.layout = null; renderTables(); }
  catch (e) { $("#tables").replaceChildren(h("p", { class: "muted", style: "padding:0 16px" }, e.message)); }
}

renderEmpty();
loadStatus(); loadModels(); loadSchema();
$("#question").focus();
</script>
